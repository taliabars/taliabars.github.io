<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 5</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div id="content">
            <header>
                <h1>Assignment 5</h1>
                <h2>Introduction to JavaScript</h2>
            </header>

            <main class="columns">
                <section id="speech" class="one">
                    <h3>Speech</h3>

                    <div id="speech-bubble">
                        Hi
                    </div>
                </section>

                <section id="beverage" class="one">
                    <h3>Beverage</h3>

                    <p>
                        <label for="beverage-select">Pick your morning beverage:</label>

                        <select id="beverage-select">
                            <option value="Coffee">Coffee</option>
                            <option value="Tea">Tea</option>
                            <option value="Orange Juice">Orange Juice</option>
                        </select>
                    </p>

                    <p id="beverage-message"></p>
                </section>

                <section id="sticker" class="one">
                    <h3>Add a Sticker</h3>

                    <div id="sticker-area">
                        <img id="sun" src="images/sun.jpg" alt="Sun">
                        <span id="emoji">🌞</span>
                    </div>
                </section>
            </main>

            <footer>
                <p>@taliabarsness</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
